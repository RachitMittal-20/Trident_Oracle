[project]
name = "approval-tokens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "core",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approval_tokens"]
