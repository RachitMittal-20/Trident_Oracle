[project]
name = "extractors"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "core",
    "pydantic>=2.9",
    "google-genai>=1.0",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractors"]
