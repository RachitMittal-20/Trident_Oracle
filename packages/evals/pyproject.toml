[project]
name = "evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "core",
    "extractors",
    "storage",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
]

[tool.uv.sources]
core = { workspace = true }
extractors = { workspace = true }
storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
