[project]
name = "trident-oracle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/core",
    "packages/extractors",
    "packages/notifiers",
    "packages/evals",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = "tests/"

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "--import-mode=importlib"
