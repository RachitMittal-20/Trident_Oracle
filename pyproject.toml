[project]
name = "trident-oracle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "core",
]

[tool.uv.sources]
core = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-python-dateutil>=2.9",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/core",
    "packages/extractors",
    "packages/notifiers",
    "packages/evals",
    "packages/storage",
    "packages/approval_tokens",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# python_version tracks the actual interpreter uv resolves into .venv (3.13,
# even though requires-python floor is 3.11), not a target for our own syntax --
# some third-party stubs (numpy) use PEP 695 syntax that only parses under
# python_version >= 3.12, regardless of what our own code uses.
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "apps/api:apps/worker:packages/core:packages/extractors:packages/notifiers:packages/evals:packages/storage:packages/approval_tokens"
exclude = "tests/"

[[tool.mypy.overrides]]
module = "core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "--import-mode=importlib"
# Lets test modules import sibling test-helper modules directly (e.g.
# extractors' tests/synth.py, shared by multiple test files) without needing
# an __init__.py, which would reintroduce the module-name collisions
# --import-mode=importlib was chosen to avoid in the first place.
pythonpath = ["packages/extractors/tests"]
